[package]
name = "safeguard-compliance"
description = "Enforcement evaluation pipeline for the Safeguard hooks contract: orders the token-scope, freeze, policy, and SAC gates and produces a fail-closed decision."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
soroban-sdk = { workspace = true }
safeguard-hook-core = { path = "../hook-core", version = "0.1.0" }
safeguard-storage = { path = "../storage", version = "0.1.0" }
safeguard-authorization = { path = "../authorization", version = "0.1.0" }
safeguard-policy-client = { path = "../policy-client", version = "0.1.0" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "gate_paths"
harness = false
