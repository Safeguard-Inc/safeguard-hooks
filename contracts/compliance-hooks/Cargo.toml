[package]
name = "compliance-hooks"
description = "Soroban compliance enforcement contract for the Safeguard hooks polyrepo: gates confidential-token operations by token scope, freeze, external policy, and SAC passthrough."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
safeguard-hook-core = { path = "../../crates/hook-core" }
safeguard-storage = { path = "../../crates/storage" }
safeguard-authorization = { path = "../../crates/authorization" }
safeguard-compliance = { path = "../../crates/compliance" }
safeguard-events = { path = "../../crates/events" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
