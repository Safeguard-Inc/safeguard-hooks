[workspace]
resolver = "2"
members = [
    "crates/hook-core",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
authors = ["Safeguard Inc."]
edition = "2021"
license = "MIT"
repository = "https://github.com/Safeguard-Inc/safeguard-hooks"
keywords = ["stellar", "soroban", "confidential-tokens", "compliance"]
categories = ["no-std", "wasm"]

[workspace.dependencies]
soroban-sdk = { version = "27.0.6", features = ["experimental_spec_shaking_v2"] }
