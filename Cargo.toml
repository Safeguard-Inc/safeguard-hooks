[workspace]
resolver = "2"
members = [
    "crates/hook-core",
    "crates/storage",
    "crates/events",
    "crates/authorization",
    "crates/policy-client",
    "crates/compliance",
    "contracts/compliance-hooks",
    "contracts/sample-policy",
    "cli",
]

# Soroban contracts run inside the VM on-chain, where every instruction is
# metered: the release profile is the gas budget. opt-level "z" and LTO keep
# the wasm small and fast (smaller code = fewer bytes fetched from the ledger
# and fewer instructions executed); panic=abort removes the unwind machinery
# no contract ever uses; strip and debug=0 drop symbols that only bloat the
# artifact. overflow-checks stay on — fail-closed arithmetic is a correctness
# guarantee here, not a cost to trade away. Mirrors safeguard-policy's
# profile so the two polyrepos ship comparable economics.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.package]
version = "0.1.0"
description = "Enforcement layer for the Safeguard compliance stack on Stellar Confidential Tokens: a fail-closed Soroban compliance-hooks contract with freeze administration and SAC passthrough."
documentation = "https://docs.rs/safeguard-hooks"
authors = ["Safeguard Inc."]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Safeguard-Inc/safeguard-hooks"
keywords = ["stellar", "soroban", "confidential-tokens", "compliance"]
categories = ["no-std", "wasm"]

[workspace.dependencies]
soroban-sdk = { version = "27.0.6" }

# Shared lint policy: no hand-written unsafe code anywhere in the workspace.
# `deny` rather than `forbid` is deliberate: soroban-sdk's #[contractimpl]
# macro emits `#[allow(unsafe_code)]` inside its generated harness, and
# forbid makes even that macro-owned allowance a hard error (E0453). With
# deny, generated code stays compilable while every human-authored unsafe
# block still fails the clippy gate (-D warnings); an explicit crate-level
# `#![allow(unsafe_code)]` would be a visible, reviewable diff. Mirrors
# safeguard-policy's intent with a scope that fits this workspace's
# macro-heavy test surfaces.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
