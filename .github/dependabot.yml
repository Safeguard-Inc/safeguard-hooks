version: 2
updates:
  # The pinned Rust release. A bump is reviewed like a code change because
  # every published number in docs/performance.md — wasm byte counts above
  # all — is a property of the compiler, so the pin and those figures must
  # move together (the procedure is documented in rust-toolchain.toml).
  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Cargo workspace dependencies (soroban-sdk, etc.). Bumps are validated by
  # the CI gate (fmt, clippy, tests, wasm build) before merge.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions workflows: pin and update the actions the pipeline uses.
  # Minor and patch bumps are grouped into a single weekly PR (each still
  # passes the full gate before merge) so routine updates do not fragment
  # into a stream of one-line PRs; major bumps stay separate for individual
  # review.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
