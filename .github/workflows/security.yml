name: security

# The explicit hardening gate. ci.yml runs fmt/clippy/tests broadly; this
# workflow names the enforcement-critical suites so a PR touching gate
# behavior must stay green against them before merge, matching the security
# posture in docs/security.md and the threat-model controls in
# docs/threat-model.md. Runs on every pull request (mandatory before merge).
# A weekly schedule additionally sweeps the dependency graph (cargo-deny
# fetches the latest advisory databases) so a freshly disclosed advisory is
# surfaced even without a PR touching dependencies.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

jobs:
  hardening:
    name: security · invariants · property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable clippy

      - name: Clippy (warnings denied)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Security suite
        run: cargo test --locked -p compliance-hooks --test security

      - name: Invariant suite
        run: cargo test --locked -p compliance-hooks --test invariants

      - name: Property suite
        run: cargo test --locked -p compliance-hooks --test fuzz

      - name: Schema and fixture validation
        run: |
          python3 -m pip install jsonschema
          bash scripts/check-schema.sh

  deny:
    name: advisories · licenses · sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cargo-deny-action runs in its own container with a pinned cargo-deny
      # binary, so no host Rust toolchain is needed here.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check