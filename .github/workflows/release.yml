name: release

# Builds the deployable contract wasm on a version tag and attaches it to the
# release. The wasm binaries are the artifacts a deployment installs; the
# tag name is the version recorded in CHANGELOG.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # Operator rehearsal: run the full gate against any ref without cutting
    # a release. The publish job below is tag-gated, so a dispatch exercises
    # everything except publishing — the pipeline proves itself before the
    # first real tag is cut.

# A release cut is per-tag by definition, so runs can never collide; the
# group still guards against a forced tag re-push racing an in-flight gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Validate schemas and fixtures
        run: |
          python3 -m pip install jsonschema
          bash scripts/check-schema.sh

  wasm:
    name: build and publish contract wasm
    needs: gate
    runs-on: ubuntu-latest
    # Tag-only: on a manual dispatch GITHUB_REF_NAME is the branch name, and
    # `gh release create main` would cut a nonsense release.
    if: github.ref_type == 'tag'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain with wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32v1-none

      - name: Build contracts (release)
        run: |
          cargo build --locked --target wasm32v1-none --release -p compliance-hooks -p sample-policy
          mkdir -p dist
          cp target/wasm32v1-none/release/compliance_hooks.wasm dist/compliance-hooks.wasm
          cp target/wasm32v1-none/release/sample_policy.wasm dist/sample-policy.wasm

      - name: Publish wasm to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.wasm --generate-notes
