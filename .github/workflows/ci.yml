name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Validate schemas and fixtures
        run: |
          python3 -m pip install jsonschema
          bash scripts/check-schema.sh

  wasm:
    name: contract wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain with wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable wasm32v1-none

      - name: Build contracts
        run: cargo build --locked --target wasm32v1-none -p compliance-hooks -p sample-policy
