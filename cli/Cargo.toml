[package]
name = "safeguard-hooks"
description = "Operator CLI for the Safeguard compliance-hooks contract: inspects and configures the on-chain enforcement layer through the stellar CLI."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "safeguard-hooks"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safeguard-hook-core = { path = "../crates/hook-core" }
